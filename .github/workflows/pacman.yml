# Publish the viblauncher Arch packages into a pacman repository served from
# this site.
#
# The packages are built by the Arch job in the viblauncher repository and
# attached to its GitHub release. This workflow collects them, builds the pacman
# database with repo-add, and commits repo/ to main, because this repo's Pages is
# the legacy "deploy from a branch" kind: whatever is committed to main is what
# is served. That makes vibstudios.space the canonical host for the pacman repo,
# which is the right place for it - it is the domain the studio already owns and
# points people at, and it avoids every other repository in the org claiming a
# Pages deployment of the apex domain.
#
# pacman needs three things, and all three are in repo/:
#   repo/viblauncher.db        the package database pacman reads
#   repo/viblauncher.files     the file list, for pacman -F
#   repo/*.pkg.tar.zst         the packages themselves
#
# pacman's config points at https://vibstudios.space/repo/$arch, so $arch is
# appended to that URL. The packages carry their architecture in the filename
# and the database indexes both, so one directory serves both.
#
# The job is split in two on purpose. repo-add needs pacman, and the Arch image
# has no node, so a JavaScript action such as actions/checkout cannot run there.
# Building the database in the container and committing it back on the runner
# keeps each half on a platform where its own tooling works, instead of
# installing a toolchain into the image to work around it.

name: Pacman repository

on:
  # Fires when the launcher workflow attaches packages to a new release, so the
  # pacman repo follows releases without being told the version separately.
  release:
    types: [published]
    repos:
      - vib-studios/viblauncher
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing launcher tag to publish, e.g. v0.2.0'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: pacman
  cancel-in-progress: false

jobs:
  build:
    name: Build pacman database
    runs-on: ubuntu-latest
    # repo-add is part of pacman, so this job runs in an Arch container. No
    # checkout and no JavaScript actions: the image has neither node nor a
    # repository to work in, and it only needs the release and the packages.
    container:
      image: archlinux:base

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      # The packages come from the release rather than being rebuilt here. A
      # pacman repo whose contents differ from the released package would be
      # worse than no pacman repo: a user installing from here and a user
      # installing the attached tarball would get different builds.
      #
      # curl rather than the gh CLI: the gh binary is not in the Arch image, and
      # the release asset URL is a stable, documented endpoint.
      - name: Download packages from the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$RELEASE_TAG"
          fi
          echo "using tag $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p packages
          api="https://api.github.com/repos/vib-studios/viblauncher/releases/tags/$tag"
          # Every asset whose name ends in the package extension. jq is not in
          # the image either, so the names are read out of the JSON with sed;
          # the fields this touches are plain strings.
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" \
            | sed -n 's/.*"browser_download_url": *"\([^"]*\.pkg\.tar\.zst\)".*/\1/p' \
            > urls.txt
          if [ ! -s urls.txt ]; then
            echo "no .pkg.tar.zst assets on $tag" >&2
            echo "the launcher Arch workflow attaches them; did it run for this tag?" >&2
            exit 1
          fi
          cat urls.txt
          while read -r url; do
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "packages/$(basename "$url")" "$url"
          done < urls.txt
          ls -l packages

      - name: Build the database
        run: |
          set -euo pipefail
          # Only the packages, not the debug ones. repo-add indexes both
          # happily; pacman would then offer a -debug package that carries no
          # runtime value over the main one.
          rm -f packages/*-debug-*.pkg.tar.zst
          ls -l packages
          # Both architectures have to be here. A repo that indexes only one
          # looks complete, and a user on the other architecture gets "no
          # packages match" rather than a reason.
          for arch in x86_64 aarch64; do
            if ! ls packages/ | grep -q -- "-${arch}\.pkg\.tar\.zst$"; then
              echo "no package for $arch" >&2
              exit 1
            fi
          done
          mkdir -p repo
          repo-add repo/viblauncher.db.tar.gz packages/*.pkg.tar.zst
          # pacman looks for the uncompressed name, which is what --print-format
          # and -Si resolve against; the .tar.gz copies are for tools that
          # expect the compressed form.
          rm -f repo/viblauncher.db repo/viblauncher.files
          cp repo/viblauncher.db.tar.gz repo/viblauncher.db
          cp repo/viblauncher.files.tar.gz repo/viblauncher.files
          cp packages/*.pkg.tar.zst repo/
          ls -l repo

      - uses: actions/upload-artifact@v7
        with:
          name: pacman-repo
          path: repo
          if-no-files-found: error

  publish:
    name: Publish to main
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pacman-repo
          path: repo

      # The database is a build artifact, not source: keeping it out of review
      # avoids a diff of binary files on every release, and a new release
      # replaces the index wholesale rather than merging with a stale one.
      - name: Commit the repository
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo
          if git diff --cached --quiet; then
            echo "pacman repo already up to date for $TAG"
            exit 0
          fi
          git commit -m "Publish the $TAG Arch packages"
          git push origin HEAD:main
